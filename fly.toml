# Copy to fly.toml, replace app/region/PUBLIC_ORIGIN; do not deploy unchanged.
app = "stateless-reader-egge21m"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "300s"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "3000"
  DATABASE_PATH = "/data/application.sqlite"
  COCO_DATABASE_PATH = "/data/coco.sqlite"
  FRONTEND_DIST_PATH = "/app/frontend/dist"
  PUBLIC_ORIGIN = "https://stateless-reader-egge21m.fly.dev"

[[mounts]]
  source = "publisher_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Exactly one Machine/process. Deploy with --ha=false; never scale out.
# No release_command: Fly release Machines do not mount application volumes.
# Before first start or a schema update, use fly.migrate.toml.example on this
# same app/volume, run dist/migrate.js explicitly, then deploy this server config.
# See docs/demo/live-wallet.md. Never migrate concurrently with the publisher.
